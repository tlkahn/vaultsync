name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full integration suite (off-hour UTC). Single job covers
    # push/PR/schedule - the I6-trigger split retired with #17.
    - cron: "17 5 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs default to `contents: read` (covers actions/checkout
# and rust-cache - the cache API is not repo contents write). Only the
# `integration` job adds `id-token: write` (job-level) for OIDC -> IAM role
# auth to the dedicated test bucket (I6-creds); no job comments on PRs or
# writes checks.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Lib + bin unit tests only: the tests/ S3 integration suite runs in
      # the dedicated `integration` job below (issue #6). Compilation of
      # the suite is still covered by the clippy job's --all-targets.
      - run: cargo test --locked --lib --bins

  msrv:
    # The job name hardcodes the floor for check-list readability; rename it
    # in the same commit as any `rust-version` bump in Cargo.toml.
    name: msrv (1.95)
    runs-on: ubuntu-latest
    env:
      # env beats rust-toolchain.toml; the declared MSRV floor - must match
      # `rust-version` in Cargo.toml (bump both in the same commit).
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked
      # lib + bin unit tests only; the S3 integration suite runs in the
      # dedicated `integration` job (issue #6)
      - run: cargo test --locked --lib --bins

  integration:
    name: integration (S3)
    # Single job on push/PR/schedule (I6-trigger / I17-ci): the #17
    # paginate skip that forced the PR-gate vs nightly split is retired.
    runs-on: ubuntu-latest
    # Hang guard; live suite (incl. s3_integ_list_paginates at conc 32 with
    # unenriched/parallel cleanup) is ~1 min on us-west-1 after #17.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC -> IAM role, this job only (I6-creds)
    env:
      # Repo variables, not secrets: none of these are sensitive and showing
      # them in logs aids debugging. OIDC stores no AWS keys at all.
      VAULTSYNC_TEST_S3_BUCKET: ${{ vars.VAULTSYNC_TEST_S3_BUCKET }}
      VAULTSYNC_TEST_S3_REGION: ${{ vars.VAULTSYNC_TEST_S3_REGION }}
      VAULTSYNC_TEST_S3_PREFIX: ci/
      # No-silent-skip sentinel (I6-sentinel): a missing bucket var fails
      # every test instead of passing on a skip.
      VAULTSYNC_TEST_S3_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.VAULTSYNC_CI_ROLE_ARN }}
          aws-region: ${{ vars.VAULTSYNC_TEST_S3_REGION }}
      # Full suite including s3_integ_list_paginates (issue #17 close-out:
      # with_store_conc(32) + unenriched cleanup list + parallel deletes).
      # --nocapture keeps the [ok]/[skip]/cleanup stderr notes in the log.
      - run: cargo test --locked --test s3_integration -- --nocapture
