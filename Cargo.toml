[package]
name = "vaultsync"
version = "0.1.0"
edition = "2024"
# MSRV: the aws-sdk-s3/aws-config 1.x line now declares rust-version = "1.94.1"
# (effectively 1.95.0, since stable rust ships as x.0.0), so the final dep
# tree's true floor is 1.95. Verified by the `msrv` CI job against this exact
# declaration (issue 5).
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Minimal, Unix-style sync of a plain directory (Obsidian vault) to object storage"
readme = "README.md"
keywords = ["obsidian", "s3", "sync", "cli"]
categories = ["command-line-utilities", "filesystem"]
publish = false

[dependencies]
aws-config = { version = "1.11.0" }
aws-sdk-s3 = { version = "1.144.0" }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt"] }
toml = { version = "1.1.4" }
