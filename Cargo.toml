[package]
name = "vaultsync"
version = "0.1.0"
edition = "2024"
# MSRV: the locked aws-sdk-s3/aws-config 1.x tree declares rust-version =
# "1.94.1"; 1.95 (the pinned toolchain, rust-toolchain.toml) satisfies that
# floor. The `msrv` CI job verifies this declaration empirically against the
# locked dep tree (issue 5). Coupling: `.github/workflows/ci.yml`
# (`RUSTUP_TOOLCHAIN` and the `msrv` job name) must be updated in the same
# commit as any bump of this value.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Minimal, Unix-style sync of a plain directory (Obsidian vault) to object storage"
readme = "README.md"
keywords = ["obsidian", "s3", "sync", "cli"]
categories = ["command-line-utilities", "filesystem"]
publish = false

[dependencies]
aws-config = { version = "1.11.0" }
aws-sdk-s3 = { version = "1.144.0" }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.150" }
tokio = { version = "1.53.1", features = ["rt"] }
toml = { version = "1.1.4" }
